[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 10_000
remappings = [
  "@somnia-chain/reactivity-contracts/=vendor/@somnia-chain/reactivity-contracts/",
]

[rpc_endpoints]
somnia_testnet = "https://api.infra.testnet.somnia.network/"
